<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: left rail with a pill-shaped active item, soft white cards on a lavender page.
   Leader flow: welcome, team cards, needs-attention, summary table + gauge, then rank, income and feed. */
:root{
  --bg:#EEF0F8; --surface:#FFFFFF; --surface2:#F4F5FB; --ink:#171C3F; --muted:#686E8E; --line:#E3E6F2;
  --accent:#6A5AE0; --accent-ink:#FFFFFF; --accent-soft:#E9E6FB;
  --orange:#E8801A; --orange-soft:#FDEBD6; --teal:#1FA58E; --teal-soft:#D6F2EA; --blue:#3F82F0; --blue-soft:#DEEAFE;
  --gold:#A8600A; --gold-soft:#FDEBD6;
  --good:#1B8550; --good-soft:#DAF2E4; --warn:#9A5A08; --warn-soft:#FDEBD0; --bad:#C0352D; --bad-soft:#FBE0DD;
  --navy:#171C3F; --navy-ink:#FFFFFF;
  --av0:#D6D1F7; --av1:#FAD9B5; --av2:#CFE2FB; --av3:#F8D2DC; --av4:#CDEFE4;
  --shadow:0 1px 2px rgba(23,28,63,.05),0 10px 30px rgba(23,28,63,.06);
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F21; --surface:#171A34; --surface2:#1F2342; --ink:#ECEEFB; --muted:#9BA1C7; --line:#2B3058;
    --accent:#8F83FF; --accent-ink:#10112A; --accent-soft:#2B2862;
    --orange:#FFAA52; --orange-soft:#3C2B15; --teal:#4FD6BE; --teal-soft:#143A30; --blue:#7DB0FF; --blue-soft:#1C2E54;
    --gold:#FFB86B; --gold-soft:#3C2B15;
    --good:#5CC680; --good-soft:#163824; --warn:#F0B64F; --warn-soft:#3A2B0D; --bad:#F2887F; --bad-soft:#43201D;
    --navy:#ECEEFB; --navy-ink:#10112A;
    --av0:#332F6E; --av1:#4A3A18; --av2:#223A66; --av3:#52272F; --av4:#1C4A3E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F21; --surface:#171A34; --surface2:#1F2342; --ink:#ECEEFB; --muted:#9BA1C7; --line:#2B3058;
  --accent:#8F83FF; --accent-ink:#10112A; --accent-soft:#2B2862;
  --orange:#FFAA52; --orange-soft:#3C2B15; --teal:#4FD6BE; --teal-soft:#143A30; --blue:#7DB0FF; --blue-soft:#1C2E54;
  --gold:#FFB86B; --gold-soft:#3C2B15;
  --good:#5CC680; --good-soft:#163824; --warn:#F0B64F; --warn-soft:#3A2B0D; --bad:#F2887F; --bad-soft:#43201D;
  --navy:#ECEEFB; --navy-ink:#10112A;
  --av0:#332F6E; --av1:#4A3A18; --av2:#223A66; --av3:#52272F; --av4:#1C4A3E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1480px;margin:0 auto;padding-top:16px}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 32px - env(safe-area-inset-top,0px));
  background:var(--surface);border-radius:24px;padding:22px 14px 16px;display:flex;flex-direction:column;gap:22px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;padding:0 8px;letter-spacing:-.02em}
.brand svg{color:var(--accent)}
.brand{text-decoration:none;color:inherit}
.side nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:16px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item[aria-current=page]{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px rgba(106,90,224,.28)}
.nav-item .pill{margin-left:auto}
.cyclecard{margin-top:auto;background:var(--accent-soft);border-radius:18px;padding:14px;font-size:.8rem;color:var(--muted)}
.cyclecard b{display:block;color:var(--ink);font-size:.9rem;margin:2px 0}
.content{min-width:0;display:flex;flex-direction:column;gap:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:0 4px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;box-shadow:var(--shadow);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none}
.search:focus-within{outline:2px solid var(--accent)}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.iconbtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn i{position:absolute;top:11px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:5px 16px 5px 6px;box-shadow:var(--shadow)}
.me .me-n{font-weight:700;font-size:.9rem;line-height:1.2}
.as{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.proto{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--accent-soft);border-radius:14px;padding:8px 14px;font-size:.82rem;color:var(--muted)}
.proto .grow{flex:1 1 260px}
.as input[type=date]{min-height:34px;padding:3px 8px}
select,input[type=text],input[type=number],input[type=email],input[type=date],textarea{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
input:disabled,select:disabled{opacity:.55}
input[readonly]{background:var(--surface2);color:var(--muted)}
main{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:.88rem}
.grid{display:grid;gap:20px}
.g-att{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.g-two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.hello{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.hello p{margin:4px 0 0}
.crews{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.crew{background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.crew-top{display:flex;align-items:center;gap:12px}
.crew-top b{display:block;line-height:1.2}
.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.c-accent.sq{background:var(--accent-soft);color:var(--accent)} .c-orange.sq{background:var(--orange-soft);color:var(--orange)}
.c-teal.sq{background:var(--teal-soft);color:var(--teal)} .c-blue.sq{background:var(--blue-soft);color:var(--blue)}
.stack{display:flex}
.stack .av{border:2px solid var(--surface);margin-left:-9px;width:32px;height:32px;font-size:.7rem}
.stack .av:first-child{margin-left:0}
.av.more{background:var(--surface2);color:var(--muted)}
.prog{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.prog b{color:var(--ink)}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.c-orange i{background:var(--orange)} .meter.c-teal i{background:var(--teal)} .meter.c-blue i{background:var(--blue)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:.74rem;font-weight:600;background:var(--surface2);border-radius:99px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.mini.warn{background:var(--warn-soft);color:var(--warn)}
.crew.add{border:2px dashed var(--accent);background:var(--surface);box-shadow:none;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);font-weight:700;min-height:150px;font-family:inherit;font-size:1rem}
.crew.add .plus{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.6rem;line-height:1}
.split{display:grid;gap:20px;grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr)}
.trio{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.gauge{width:100%;max-width:310px;display:block;margin:4px auto 0}
.g-num{font:800 30px var(--display);fill:var(--ink)}
.g-sub{font:500 12px var(--body);fill:var(--muted)}
.g-end{font:500 11px var(--body);fill:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:10px}
.stats4 b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stats4 span{font-size:.72rem;color:var(--muted);line-height:1.2;display:block}
.stats4 .n1{color:var(--ink)} .stats4 .n2{color:var(--teal)} .stats4 .n3{color:var(--orange)} .stats4 .n4{color:var(--accent)}
.btn{border:0;background:var(--surface2);color:var(--ink);border-radius:12px;padding:8px 16px;min-height:42px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--navy);color:var(--navy-ink);border-radius:999px;padding:10px 20px}
.btn.sm{min-height:32px;padding:4px 12px;font-size:.84rem;border-radius:10px}
.btn.good{background:var(--good-soft);color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-block;font-size:.73rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.av{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;object-fit:cover}
.av.lg{width:68px;height:68px;font-size:1.25rem}
.a0{background:var(--av0)} .a1{background:var(--av1)} .a2{background:var(--av2)} .a3{background:var(--av3)} .a4{background:var(--av4)}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1 1 180px;min-width:0}
.row .name{font-weight:700}
.mono{font-family:var(--mono);font-size:.82rem}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface2);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.84rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td.num,th.num{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.diff{display:block;font-size:.7rem;color:var(--warn);white-space:nowrap}
.tree .node{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 0;cursor:pointer}
.tree .lvl{border-left:2px solid var(--line);margin-left:19px;padding-left:16px}
.tree .dim{opacity:.6}
.ci-layout{display:grid;gap:20px;grid-template-columns:minmax(210px,270px) minmax(0,1fr)}
@media (max-width:760px){.ci-layout{grid-template-columns:1fr}}
.ci-list{display:flex;flex-direction:column;gap:10px}
.ci-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:2px solid transparent;background:var(--surface);border-radius:18px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.ci-item[aria-pressed=true]{border-color:var(--accent)}
.mail{border-radius:16px;background:var(--surface2);padding:16px 18px;margin-bottom:18px}
.mail .meta{font-size:.78rem;color:var(--muted)}
.mail .subj{font-weight:700;margin:2px 0 6px}
.mail p{margin:6px 0}
form .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
form label,.lbl{font-size:.85rem;font-weight:600}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hint{font-size:.82rem;color:var(--muted)}
.hint.good{color:var(--good)} .hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)}
.goal{display:flex;gap:8px;margin-bottom:8px}
.goal select{flex:none;font-weight:700;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.goal input{flex:1;min-width:0}
.yn{display:flex;gap:12px;flex-wrap:wrap}
.yn label{flex:1 1 140px;border:2px solid transparent;border-radius:16px;padding:14px;text-align:center;cursor:pointer;font-weight:700;background:var(--surface2)}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.yn label:has(input:focus-visible){outline:2px solid var(--accent)}
.counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.counters input{width:100%}
.feed .post{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.feed .post:first-child{border-top:0;padding-top:4px}
.spark{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--orange-soft);color:var(--orange)}
.spark.rank{background:var(--accent-soft);color:var(--accent)}
.bars{display:flex;align-items:flex-end;gap:12px;height:150px;border-bottom:1px solid var(--line);padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;max-width:46px;background:var(--accent-soft);border-radius:12px 12px 6px 6px;min-height:4px}
.bars div.now i{background:var(--orange)}
.bars div.now{color:var(--ink);font-weight:700}
.axis{display:flex;gap:12px;font-size:.75rem;color:var(--muted);padding-top:6px}
.axis span{flex:1;text-align:center}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.lock{display:inline-flex;align-items:center;gap:6px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(13,15,40,.55);display:grid;place-items:start center;padding:24px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:24px;padding:24px;width:min(680px,100%);margin-block:auto;box-shadow:var(--shadow)}
.modal .x{float:right}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kv div{background:var(--surface2);border-radius:14px;padding:10px 14px}
.kv .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--navy);color:var(--navy-ink);padding:11px 20px;border-radius:14px;max-width:min(520px,calc(100% - 32px));box-shadow:var(--shadow)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-radius:20px;overflow-x:auto;gap:10px}
  .side nav{flex-direction:row}
  .brand{padding:0 6px}
  .cyclecard{display:none}
}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>

<div class="shell">
  <aside class="side">
    <a class="brand" href="./" title="Back to the landing page">
      <svg width="30" height="30" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M2 15h6l3-9 5 17 3-8h7" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      TeamPulse
    </a>

    <div class="cyclecard" id="cyclecard"></div>
  </aside>

    <header class="top">
      <label class="search" id="searchbox"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search members, TeamPulse ID or NeoLife ID" aria-label="Search members"></label>
      <div class="top-right">
        <button class="iconbtn" type="button" data-act="bell" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17h12l-1.5-2V10.5a4.5 4.5 0 10-9 0V15z"/><path d="M10 20a2 2 0 004 0"/></svg><i id="bell-dot" hidden></i></button>
        <div class="me" id="me"></div>

    <main id="main"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" role="status" hidden></div>

<script>

/* ---------- team ---------- */
function team(){
  const root=S.role==='admin'?'leader':meId();
  const node=(m,d)=>{
    const c=kids(m.id);
    return `<div class="node ${m.status==='pending'?'dim':''}" data-act="member" data-id="${m.id}">${av(m)}
      <div class="grow" style="flex:1 1 180px"><div style="font-weight:600">${esc(m.name)}</div><div class="mono sub">${esc(m.teamId)} · ${esc(m.neoId)}</div></div>
      ${pill(rankName(m),m.leader||m.rank>=1?'acc':'')}${m.status==='pending'?pill('Pending','warn'):''}
    </div>${c.length?`<div class="lvl">${c.map(k=>node(k,d+1)).join('')}</div>`:''}`;
  };
  const r=byId(root);
  return `<section class="card"><div class="head"><h2>${S.role==='admin'?'Whole team':'Your downline'}</h2><span class="sub">${subtreeIds(root).length-1} people under ${esc(r.name)}${S.role==='qsm'?'. QSMs only see their own downline.':''}</span></div>
    <div class="tree" style="margin-top:12px">${node(r,0)}</div></section>`;
}

/* ---------- sign-ups ---------- */
function newMemberForm(p,sponsorId){
  const sel=sponsorId?`<input type="hidden" name="sponsor" value="${sponsorId}">`:
   `<div class="field"><label for="${p}sp">Sponsor</label><select id="${p}sp" name="sponsor">${S.members.filter(m=>m.status==='active').map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div>`;
  return `<form data-form="newmember" novalidate>${sel}
    <div class="field"><label for="${p}nm">Full name</label><input id="${p}nm" name="name" type="text" required></div>
    <div class="field"><label for="${p}em">Email</label><input id="${p}em" name="email" type="email" required></div>
    <div class="field"><label for="${p}ph">Phone</label><input id="${p}ph" name="phone" type="text"></div>
    <div class="field"><label for="${p}ne">NeoLife ID</label><input id="${p}ne" name="neo" type="text" placeholder="063-9262173" inputmode="numeric" maxlength="11" required>
      <span class="hint">3 digits, a hyphen, 7 digits. Double-check it. It is the official NeoLife number, and only the Admin can correct it later.</span></div>
    <div class="field"><label for="${p}pv">First-order PV</label><input id="${p}pv" name="pv" type="number" min="0" list="${p}pvl" placeholder="136" required><datalist id="${p}pvl"><option value="100"><option value="136"><option value="250"><option value="272"></datalist><span class="hint">They have already ordered. This becomes their PPV and counts toward their sponsor's QPV once they are active.</span></div>

function signups(){

          <button class="btn sm good" type="button" data-act="confirm" data-id="${c.id}">Confirm</button><button class="btn sm bad" type="button" data-act="reject" data-id="${c.id}">Reject</button></div>`}).join('')}</div>`:'<div class="empty">No claims waiting.</div>'}

      <section class="card"><h3>Confirmed, waiting for details</h3>
        ${details.length?`<div class="rows">${details.map(c=>`<div class="row"><div class="grow"><div class="name">${esc(byId(c.by).name)}</div><div class="sub">${c.count} person${c.count>1?'s':''} still to add</div></div><button class="btn sm" type="button" data-act="openmail" data-id="${c.id}">See the mail they got</button></div>`).join('')}</div>`:'<div class="empty">Nothing waiting.</div>'}

      </section>
    </div>
    <section class="card"><h3>Add a sign-up</h3><p class="sub" style="margin-top:0">For when a sponsor tells you about a new person. They start as Pending and get a TeamPulse ID automatically.</p>${newMemberForm('add-')}</section>

/* ---------- check-ins ---------- */
function checkins(){
  const asId=S.role==='admin'?S.asId:meId();
  const m=byId(asId);
  const picker=S.role==='admin'?`<label class="as" for="asid">Answering as <select id="asid">${S.members.filter(x=>!x.leader&&x.status==='active').map(x=>`<option value="${x.id}" ${x.id===asId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:'';
  const list=Object.keys(CI).map(k=>{
    const st=ciState(k),o=st.o,isOpen=st.state==='open',ans=isOpen&&m.ans.includes(o.id);
    const badge=isOpen?(ans?pill('Answered','good'):pill('Open','warn')):pill('Locked');
    const when=isOpen?'Open until '+dmy(o.close):'Opens '+dmy(o.open);
    const missed=!isOpen&&st.last&&!m.ans.includes(st.last.id)?`<span class="sub" style="color:var(--bad)">Missed on ${dmy(st.last.date)}</span>`:'';
    return `<button class="ci-item" type="button" data-act="ci" data-v="${k}" aria-pressed="${S.ci===k}">${badge}<b>${CI[k].title}</b><span class="sub">The ${CI[k].day} · ${when}</span>${missed}</button>`}).join('');
  const c=CI[S.ci],st=ciState(S.ci),locked=st.state==='locked',lastMissed=locked&&st.last&&!m.ans.includes(st.last.id);
  return `<div class="head"><div><h2>Check-ins</h2><p class="sub" style="margin:2px 0 0">What ${esc(m.name.split(' ')[0])} receives by email and fills in.</p></div>${picker}</div>
  <div class="ci-layout"><div class="ci-list">${list}</div>
    <section class="card">
      ${locked?`<div class="mail"><div class="meta">Question date: the ${c.day}</div><div class="subj">${c.title} is not open yet</div><p>This check-in opens on <b>${dmy(st.o.open)}</b>, ${OPEN_BEFORE} days before the ${c.day}. You can answer until <b>${dmy(st.o.close)}</b>, ${CLOSE_AFTER} days after.</p>${lastMissed?`<p style="color:var(--bad)">The last one (${dmy(st.last.date)}) closed on ${dmy(st.last.close)} without an answer.</p>`:''}</div>`
      :`<div class="mail"><div class="meta">From TeamPulse · to ${esc(m.name)} · open ${dmy(st.o.open)} to ${dmy(st.o.close)}</div><div class="subj">${c.subject}</div><p>Hi ${esc(m.name.split(' ')[0])}, ${c.body}</p><p class="meta">It takes about two minutes. Your answer counts for the ${c.day}, even if you send it a few days late (until ${dmy(st.o.close)}).</p></div>
      ${ciForm(S.ci,m)}`}
    </section></div>`;
}
function ciForm(k,m){
  if(k==='earn'){const none=m.earn==='none';return `<form data-form="earn" novalidate>
    <div class="field"><label for="e-amt">Money made this month (USD)</label>
      <div class="inline"><input id="e-amt" name="amt" type="number" min="0" step="1" value="${typeof m.earn==='number'?m.earn:''}" ${none?'disabled':''}>
      <label class="inline" style="font-weight:400"><input id="e-none" name="none" type="checkbox" ${none?'checked':''}> Not yet</label></div></div>
    <div class="field"><label for="e-ord">Active orders on your account right now</label><input id="e-ord" name="orders" type="number" min="0" value="${m.orders==null?'':m.orders}"></div>
    <div class="field"><label for="e-del">Orders delivered and accepted this month</label><input id="e-del" name="delivered" type="number" min="0" value="${m.delivered==null?'':m.delivered}"></div>
    <div class="field"><label for="e-drop">Amount that will drop into your account (USD)</label><input id="e-drop" name="drop" type="number" min="0" step="1" value="${m.drop==null?'':m.drop}"></div>
    <div class="field"><label for="e-clr">Date the money drops and you can withdraw it</label><input id="e-clr" name="clears" type="date" value="${m.clears||''}"><span class="hint">Your leader uses this date to plan the days for your PPV order.</span></div>
    <p class="hint" id="e-err" role="alert"></p>
    <button class="btn primary" type="submit">Save my answers</button></form>`}
  if(k==='ppv'){const none=m.qpv===0;return `<form data-form="ppv" novalidate>
    <div class="field"><label for="p-ppv">Your PPV this month</label><input id="p-ppv" name="ppv" type="number" min="0" value="${m.ppv==null?'':m.ppv}"><span class="hint" id="p-ppvh">NeoLife asks for 100 PPV to stay active.</span></div>
    <div class="field"><label for="p-qpv">Your team's QPV</label>
      <div class="inline"><input id="p-qpv" name="qpv" type="number" min="0" value="${m.qpv==null?'':m.qpv}" ${none?'disabled':''}>
      <label class="inline" style="font-weight:400"><input id="p-none" name="none" type="checkbox"> None yet, I have no downline</label></div>
      <span class="hint" id="p-qpvh">If you have no downline, your QPV is just your PPV.</span></div>
    <button class="btn primary" type="submit">Save my answers</button></form>`}
  if(k==='plan'){const g=(m.plan&&m.plan.goals.length?m.plan.goals:[['I will','']]);return `<form data-form="plan" novalidate>
    <div class="lbl" style="margin-bottom:6px">My goals for ${(()=>{const o=ciState('plan').o;return monthName(o.date.getFullYear(),o.date.getMonth()+1)})()}</div>
    <div id="goals">${g.map(([p,t])=>goalRow(p,t)).join('')}</div>
    <button class="btn sm" type="button" data-act="addgoal" style="margin-bottom:16px">Add another goal</button>
    <div class="field"><label for="pl-s">How many people will you sign?</label><input id="pl-s" name="signups" type="number" min="0" value="${m.plan?m.plan.signups:''}"></div>
    <div class="field"><label for="pl-t">How much do you want to make?</label><select id="pl-t" name="target">${['$0 to $300','$300 to $1,000','$1,000 and above'].map(o=>`<option ${m.plan&&m.plan.target===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="field"><label for="pl-p">Your PPV for next month</label><input id="pl-p" name="pp" type="number" min="0"></div>
    <div class="field"><label for="pl-q">Your QPV for next month</label><input id="pl-q" name="pq" type="number" min="0"></div>
    <button class="btn primary" type="submit">Save my plan</button></form>`}
  if(k==='paid'){return `<form data-form="paid" novalidate><div class="lbl" style="margin-bottom:8px">Have you paid your monthly responsibility?</div>
    <div class="yn"><label><input type="radio" name="paid" value="yes" ${m.paid===true?'checked':''}> Yes, paid</label><label><input type="radio" name="paid" value="no" ${m.paid===false?'checked':''}> Not yet</label></div>
    <p class="hint" id="paid-err" role="alert"></p><button class="btn primary" type="submit">Save my answer</button></form>`}
  return `<form data-form="signup" novalidate><div class="lbl" style="margin-bottom:8px">Did you sign anyone this month?</div>
    <div class="yn" style="margin-bottom:14px"><label><input type="radio" name="su" value="yes"> Yes</label><label><input type="radio" name="su" value="no"> No</label></div>
    <div class="field"><label for="s-n">If yes, how many?</label><input id="s-n" name="count" type="number" min="1" value="1"><span class="hint">Your Admin confirms it, then you get a second email to enter their details.</span></div>
    <div class="lbl" style="margin-bottom:6px">Step-ups in your team this month</div>
    <div class="counters" style="margin-bottom:14px">${['Managers','Senior Managers','Executive Managers','Directors'].map((x,i)=>`<div><label for="st${i}" class="sub">${x}</label><input id="st${i}" name="st${i}" type="number" min="0" value="0"></div>`).join('')}</div>
    <div class="lbl" style="margin-bottom:8px">Did you buy any tools this month?</div>
    <div class="yn" style="margin-bottom:14px"><label><input type="radio" name="tools" value="yes"> Yes</label><label><input type="radio" name="tools" value="no" checked> No</label></div>
    <p class="hint" id="su-err" role="alert"></p><button class="btn primary" type="submit">Save my answers</button></form>`;
}
function goalRow(p,t){return `<div class="goal"><select name="gp" aria-label="Goal starts with"><option ${p==='I will'?'selected':''}>I will</option><option ${p==='I must'?'selected':''}>I must</option></select><input name="gt" type="text" aria-label="Goal" value="${esc(t)}" placeholder="what you will do"></div>`}

/* ---------- feed ---------- */
function feed(){
  const items=S.feed.map(f=>{
    const w=byId(f.who);
    if(f.kind==='join')return {id:f.id,rank:false,t:`<b>${esc(w.name)}</b> joined the team`,s:`Sponsored by ${esc(byId(f.by).name)}`,when:f.when};
    return {id:f.id,rank:true,t:`<b>${esc(w.name)}</b> stepped up to ${esc(f.to)}`,s:'Congratulations on the new rank',when:f.when};
  });
  return `<section class="card feed"><div class="head"><h2>Team feed</h2><span class="sub">New members and step-ups, shown to the whole team</span></div>
   <div style="margin-top:8px">${items.map(i=>`<div class="post"><div class="spark ${i.rank?'rank':''}" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${i.rank?'<path d="M12 19V5M5 12l7-7 7 7"/>':'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>'}</svg></div>

}

/* ---------- profile ---------- */

  const m=byId(meId());
  const editable=false;
  const next=!m.leader&&m.rank<3?RANKS[m.rank+1]:null;
  const pctN=next&&m.qpv!=null?Math.min(100,Math.round(m.qpv/next.q*100)):0;
  const sim='';
  return `<div class="grid g-two">
    <section class="card"><h2>My profile</h2>
      <form data-form="profile" novalidate style="margin-top:14px">
        <div class="inline" style="margin-bottom:14px">${av(m,'lg')}<div class="field" style="margin:0"><label for="pf-ph">Profile picture</label><input id="pf-ph" type="file" accept="image/*"></div></div>
        <div class="field"><label for="pf-n">Display name</label><input id="pf-n" name="name" type="text" value="${esc(m.name)}"></div>
        <div class="field"><label for="pf-p">Phone</label><input id="pf-p" name="phone" type="text" value="${esc(m.phone)}"></div>
        <div class="field"><label for="pf-c">City</label><input id="pf-c" name="city" type="text" value="${esc(m.city)}"></div>
        <div class="field"><label for="pf-b">About me</label><textarea id="pf-b" name="bio">${esc(m.bio)}</textarea></div>
        <div class="field"><label for="pf-t">TeamPulse ID</label><div class="lock"><input id="pf-t" type="text" class="mono" value="${esc(m.teamId)}" readonly><span class="pill">Set by the system</span></div></div>
        <div class="field"><label for="pf-ne">NeoLife ID</label>

    const upd=()=>{
      const v=pp.value===''?null:Number(pp.value),h=$('#p-ppvh');
      if(v==null){h.className='hint';h.textContent='NeoLife asks for 100 PPV to stay active.'}
      else if(v<100){h.className='hint bad';h.textContent=v+' PPV is under the 100 minimum. You will not be active for bonuses this month.'}
      else{h.className='hint good';h.textContent=v+' PPV. You meet the 100 minimum.'}
      const q=pn.checked?(v||0):(pq.value===''?null:Number(pq.value)),qh=$('#p-qpvh');
      if(q==null){qh.className='hint';qh.textContent='If you have no downline, your QPV is just your PPV.'}
      else{let best=0;for(let i=1;i<=3;i++)if(q>=RANKS[i].q)best=i;
        if(v!=null&&v>=100&&best>0){qh.className='hint good';qh.textContent=num(q)+' QPV reaches '+RANKS[best].n+' ('+num(RANKS[best].q)+'). Your Admin will review it.'}
        else{const nx=RANKS[Math.max(1,best+1)];qh.className='hint';qh.textContent=num(q)+' QPV. Next threshold: '+nx.n+' at '+num(nx.q)+(v!=null&&v<100?', and it needs 100 PPV.':'.')}}
    };
    pp.oninput=upd;pq.oninput=upd;pn.onchange=()=>{pq.disabled=pn.checked;upd()};
    if(pp.value)upd();
  }
}

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,d=new FormData(f);
  const who=byId(S.role==='admin'?S.asId:meId());
  const mark=key=>{const st=ciState(key);if(st.state==='open'&&!who.ans.includes(st.o.id))who.ans.push(st.o.id)};
  if(k==='fixneo'){
    const m=byId(f.dataset.id),v=String(d.get('neo')).trim(),err=$('#fx-err');
    if(!validNeo(v)){err.className='hint bad';err.textContent='NeoLife ID must look like 063-9262173.';return}
    if(S.members.some(x=>x.id!==m.id&&x.neoId===v)){err.className='hint bad';err.textContent='That NeoLife ID belongs to someone else.';return}
    if(v===m.neoId){err.className='hint';err.textContent='No change to save.';return}
    (m.neoLog=m.neoLog||[]).push({from:m.neoId,to:v});m.neoId=v;render();toast('NeoLife ID corrected and logged.');return;
  }
  if(k==='signin'){
    const raw=String(d.get('id')).trim(),pw=String(d.get('pw')),v=raw.toUpperCase().replace(/\s/g,'').replace(/0W/,'OW');
    const fail=(msg,extra)=>{S.modal=Object.assign({t:'signin',err:msg},extra||{});renderModal()};
    if(!v||!pw)return fail('Enter your TeamPulse ID and password.');
    const m=S.members.find(x=>x.teamId===v);
    if(!m)return fail('The TeamPulse ID or password is not right.');
    if(m.status==='pending')return fail('Your account is waiting for activation by your team leader. You will get an email when it opens.');
    if(m.locked)return fail('This account is locked after 5 wrong tries. Use "Forgot your password?" or ask your team leader to reset it.');
    if(m.pw==null)return fail('You have not set a password yet. Open the "Set your password" link in your welcome email.',{needsSet:m.id});
    if(pw!==m.pw){m.tries=(m.tries||0)+1;if(m.tries>=5){m.locked=true;return fail('Locked after 5 wrong tries. Use "Forgot your password?" or ask your team leader to reset it.')}return fail('The TeamPulse ID or password is not right. '+(5-m.tries)+' tries left.')}
    m.tries=0;signInAs(m);return;
  }
  if(k==='forgot'){
    const v=String(d.get('id')).trim().toUpperCase().replace(/\s/g,'').replace(/0W/,'OW'),m=S.members.find(x=>x.teamId===v&&x.status==='active');
    S.modal={t:'signin',step:'sent',found:m||null};renderModal();return;
  }
  if(k==='setpw'){
    const m=byId(f.dataset.id),p1=String(d.get('p1')),p2=String(d.get('p2')),err=$('#sp-err');
    const bad=x=>{err.className='hint bad';err.textContent=x};
    if(p1.length<8||!/[A-Za-z]/.test(p1)||!/\d/.test(p1))return bad('Use at least 8 characters, with a letter and a number.');
    if(p1!==p2)return bad('The two passwords do not match.');
    m.pw=p1;m.tries=0;m.locked=false;signInAs(m);return;
  }
  if(k==='earn'){
    const none=d.get('none')==='on';
    if(!none&&d.get('amt')===''){toast('Enter an amount, or tick "Not yet".');return}
    const drop=d.get('drop')===''?0:Number(d.get('drop'));
    if(drop>0&&!d.get('clears')){$('#e-err').className='hint bad';$('#e-err').textContent='Add the date the money drops, so your leader can plan your PPV order.';return}
    who.earn=none?'none':Number(d.get('amt'));who.orders=d.get('orders')===''?0:Number(d.get('orders'));
    who.delivered=d.get('delivered')===''?0:Number(d.get('delivered'));who.drop=drop;who.clears=d.get('clears')||null;
    mark('earn');render();toast('Saved to '+who.name.split(' ')[0]+"'s profile");
  }else if(k==='ppv'){
    if(d.get('ppv')===''){toast('Enter your PPV.');return}
    who.ppv=Number(d.get('ppv'));who.qpv=d.get('none')==='on'?who.ppv:(d.get('qpv')===''?who.ppv:Number(d.get('qpv')));
    mark('ppv');render();toast('Saved. '+(who.ppv<100?'PPV is under 100, so your Admin will see a flag.':'You meet the 100 PPV minimum.'));
  }else if(k==='plan'){
    const p=d.getAll('gp'),t=d.getAll('gt');
    const goals=p.map((x,i)=>[x,t[i].trim()]).filter(g=>g[1]);
    if(!goals.length){toast('Write at least one goal after "I will" or "I must".');return}
    who.plan={goals,signups:Number(d.get('signups')||0),target:d.get('target')};
    mark('plan');render();toast('Plan saved. Every goal keeps its "I will" or "I must".');
  }else if(k==='paid'){
    const v=d.get('paid');if(!v){$('#paid-err').className='hint bad';$('#paid-err').textContent='Choose yes or not yet.';return}
    who.paid=v==='yes';mark('paid');render();toast('Saved');
  }else if(k==='signup'){
    const v=d.get('su');if(!v){$('#su-err').className='hint bad';$('#su-err').textContent='Choose yes or no.';return}
    mark('signup');
    if(v==='yes'){const n=Math.max(1,Number(d.get('count')||1));S.claims.push({id:'c'+(S.n++),by:who.id,count:n,planned:who.plan?who.plan.signups:0,src:'25th check-in',state:'review'});render();toast('Saved. Your Admin will confirm your '+n+' sign-up'+(n>1?'s':'')+'.')}
    else{render();toast('Saved')}
  }else if(k==='report'){
    const n=Math.max(1,Number(d.get('count')||1));
    S.claims.push({id:'c'+(S.n++),by:meId(),count:n,planned:byId(meId()).plan?byId(meId()).plan.signups:0,src:'Reported to Admin today'+(d.get('who')?' ('+d.get('who')+')':''),state:'review'});
    f.reset();toast('Your Admin has been told. They will add the new person.');
  }else if(k==='profile'){
    const m=byId(meId()),err=$('#pf-err'),nm=String(d.get('name')).trim();
    if(!nm){err.className='hint bad';err.textContent='Display name cannot be empty.';return}
    m.name=nm;m.phone=d.get('phone');m.city=d.get('city');m.bio=d.get('bio');
    render();toast('Profile saved');
  }else if(k==='newmember'){
    const p=f.closest('#dm')?'dm-':'add-',err=$('#'+p+'err');
    const name=String(d.get('name')).trim(),neo=String(d.get('neo')).trim(),email=String(d.get('email')).trim();
    const bad=m=>{err.className='hint bad';err.textContent=m};
    const pv=Number(d.get('pv'));
    if(!name)return bad('Enter the new person\'s full name.');
    if(!/^\S+@\S+\.\S+$/.test(email))return bad('Enter a valid email address.');
    if(!validNeo(neo))return bad('NeoLife ID must look like 063-9262173 (3 digits, a hyphen, 7 digits).');
    if(S.members.some(x=>x.neoId===neo))return bad('That NeoLife ID is already in the system.');
    if(!(pv>0))return bad('Enter the PV of their first order, for example 100, 136, 250 or 272.');
    const nm={id:'m_'+(S.n++),name,email,rank:0,sponsor:d.get('sponsor'),teamId:teamId(),neoId:neo,status:'pending',pw:null,tries:0,locked:false,ans:[],firstPv:pv,ppv:pv,qpv:pv,earn:null,orders:null,clears:null,paid:null,done:[],plan:null,phone:String(d.get('phone')||''),city:'',bio:'',photo:null,idHrs:0,pendingHrs:0,history:[]};
    S.members.push(nm);
    const dm=f.closest('#dm');
    if(dm){const c=S.claims.find(x=>x.id===dm.dataset.claim);c.count-=1;if(c.count<=0)S.claims=S.claims.filter(x=>x!==c);S.modal=null}
    render();
    toast(name+' added with a '+pv+' PV first order and TeamPulse ID '+nm.teamId+'. Pending until you activate; it activates itself in 24 hours.');
  }
});
$('#today').onchange=e=>{if(e.target.value){S.today=e.target.value;render()}};
$('#q').oninput=e=>{S.q=e.target.value;if(S.view!=='dashboard')S.view='dashboard';render()};
fresh();render();
(function fromLanding(){
  if(location.hash!=='#signin')return;
  let id='';try{id=sessionStorage.getItem('tp_id')||'';sessionStorage.removeItem('tp_id')}catch(_){}
  S.modal={t:'signin',prefill:id};renderModal();
  const el=$(id?'#si-pw':'#si-id');if(el)el.focus();
})();
</script>
