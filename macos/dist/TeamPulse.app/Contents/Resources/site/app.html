<style>
/* Layout: left rail with a pill-shaped active item, soft white cards on a lavender page.

:root{
  --bg:#EEF0F8; --surface:#FFFFFF; --surface2:#F4F5FB; --ink:#171C3F; --muted:#686E8E; --line:#E3E6F2;
  --accent:#6A5AE0; --accent-ink:#FFFFFF; --accent-soft:#E9E6FB;

  --gold:#A8600A; --gold-soft:#FDEBD6;
  --good:#1B8550; --good-soft:#DAF2E4; --warn:#9A5A08; --warn-soft:#FDEBD0; --bad:#C0352D; --bad-soft:#FBE0DD;
  --navy:#171C3F; --navy-ink:#FFFFFF;
  --av0:#D6D1F7; --av1:#FAD9B5; --av2:#CFE2FB; --av3:#F8D2DC; --av4:#CDEFE4;
  --shadow:0 1px 2px rgba(23,28,63,.05),0 10px 30px rgba(23,28,63,.06);
  --display:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F21; --surface:#171A34; --surface2:#1F2342; --ink:#ECEEFB; --muted:#9BA1C7; --line:#2B3058;
    --accent:#8F83FF; --accent-ink:#10112A; --accent-soft:#2B2862;
    --orange:#FFAA52; --orange-soft:#3C2B15; --teal:#4FD6BE; --teal-soft:#143A30; --blue:#7DB0FF; --blue-soft:#1C2E54;
    --gold:#FFB86B; --gold-soft:#3C2B15;
    --good:#5CC680; --good-soft:#163824; --warn:#F0B64F; --warn-soft:#3A2B0D; --bad:#F2887F; --bad-soft:#43201D;
    --navy:#ECEEFB; --navy-ink:#10112A;
    --av0:#332F6E; --av1:#4A3A18; --av2:#223A66; --av3:#52272F; --av4:#1C4A3E;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F21; --surface:#171A34; --surface2:#1F2342; --ink:#ECEEFB; --muted:#9BA1C7; --line:#2B3058;
  --accent:#8F83FF; --accent-ink:#10112A; --accent-soft:#2B2862;
  --orange:#FFAA52; --orange-soft:#3C2B15; --teal:#4FD6BE; --teal-soft:#143A30; --blue:#7DB0FF; --blue-soft:#1C2E54;
  --gold:#FFB86B; --gold-soft:#3C2B15;
  --good:#5CC680; --good-soft:#163824; --warn:#F0B64F; --warn-soft:#3A2B0D; --bad:#F2887F; --bad-soft:#43201D;
  --navy:#ECEEFB; --navy-ink:#10112A;
  --av0:#332F6E; --av1:#4A3A18; --av2:#223A66; --av3:#52272F; --av4:#1C4A3E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;font-weight:800} h2{font-size:1.3rem;font-weight:700} h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}

.brand svg{color:var(--accent)}

.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;font-size:inherit}
.side nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:16px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;white-space:nowrap}
.nav-item:hover{background:var(--surface2);color:var(--ink)}

.cyclecard{margin-top:auto;background:var(--accent-soft);border-radius:18px;padding:14px;font-size:.8rem;color:var(--muted)}

.content{min-width:0;display:flex;flex-direction:column;gap:18px}

.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;box-shadow:var(--shadow);color:var(--muted)}

.popwrap{position:relative}

.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(370px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(10,10,40,.3);z-index:50;padding:8px;text-align:left}

@media (max-width:560px){.popwrap{position:static}.pop{position:fixed;left:12px;right:12px;top:72px;width:auto}}
.top-right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.iconbtn{position:relative;width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn i{position:absolute;top:11px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--orange);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:5px 16px 5px 6px;box-shadow:var(--shadow)}
.me .me-n{font-weight:700;font-size:.9rem;line-height:1.2}
.as{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}

.as input[type=date]{min-height:34px;padding:3px 8px}
select,input[type=text],input[type=number],input[type=email],input[type=date],input[type=password],input[type=search],textarea{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:42px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
input:disabled,select:disabled{opacity:.55}

main{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border-radius:22px;padding:22px;box-shadow:var(--shadow);min-width:0}
.card h3{margin-bottom:12px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.sub{color:var(--muted);font-size:.88rem}
.grid{display:grid;gap:20px}
.g-att{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}

.crews{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}

.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.c-accent.sq{background:var(--accent-soft);color:var(--accent)} .c-orange.sq{background:var(--orange-soft);color:var(--orange)}
.c-teal.sq{background:var(--teal-soft);color:var(--teal)} .c-blue.sq{background:var(--blue-soft);color:var(--blue)}
.stack{display:flex}

.stack .av:first-child{margin-left:0}

.prog{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.prog b{color:var(--ink)}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.c-orange i{background:var(--orange)} .meter.c-teal i{background:var(--teal)} .meter.c-blue i{background:var(--blue)}
.minis{display:flex;flex-wrap:wrap;gap:6px}
.mini{font-size:.74rem;font-weight:600;background:var(--surface2);border-radius:99px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.mini.warn{background:var(--warn-soft);color:var(--warn)}
.crew.add{border:2px dashed var(--accent);background:var(--surface);box-shadow:none;align-items:center;justify-content:center;cursor:pointer;color:var(--accent);font-weight:700;min-height:150px;font-family:inherit;font-size:1rem}
.crew.add .plus{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.6rem;line-height:1}
.split{display:grid;gap:20px;grid-template-columns:minmax(0,2.3fr) minmax(250px,1fr)}
.trio{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.gauge{width:100%;max-width:310px;display:block;margin:4px auto 0}
.g-num{font:800 30px var(--display);fill:var(--ink)}
.g-sub{font:500 12px var(--body);fill:var(--muted)}
.g-end{font:500 11px var(--body);fill:var(--muted)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:10px}
.stats4 b{display:block;font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stats4 span{font-size:.72rem;color:var(--muted);line-height:1.2;display:block}
.stats4 .n1{color:var(--ink)} .stats4 .n2{color:var(--teal)} .stats4 .n3{color:var(--orange)} .stats4 .n4{color:var(--accent)}
.btn{border:0;background:var(--surface2);color:var(--ink);border-radius:12px;padding:8px 16px;min-height:42px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--accent-soft)}

.btn.good{background:var(--good-soft);color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}

.rows{display:flex;flex-direction:column}

<script>
'use strict';
/* TeamPulse app prototype. Everything is stored in this browser only (localStorage).
   The "Test tools" button stands in for things the real app does by itself (sending email, passing time). */

/* ============================== data and storage ============================== */
const RANKS=[{n:'Distributor',q:0},{n:'Manager',q:500},{n:'Senior Manager',q:1000},{n:'Executive Manager',q:2000},{n:'Director',q:4000}];
const KEYS=['earn','ppv','plan','signup','paid'];
const CI={
  earn:{d:10,day:'10th',title:'Earnings and orders',subject:'How much have you made this month?',body:'Tell us your earnings, your active orders, the orders delivered and accepted, and when your money drops.'},
  ppv:{d:14,day:'14th',title:'PPV and QPV',subject:'Your affirmation plan: PPV and QPV',body:'How many PPV will you finish this month? How much QPV is your team building?'},
  plan:{d:15,day:'15th',title:'New-month plan',subject:'Your new-month plan starts today',body:'Write what you will do next month. Every goal starts with "I will" or "I must".'},
  signup:{d:25,day:'25th',title:'Sign-ups and step-ups',subject:'Did you sign anyone this month?',body:'Tell us about new sign-ups, step-ups in your team and any tools you bought.'},
  paid:{d:28,day:'28th',title:'Monthly responsibility',subject:'Have you paid your monthly responsibility?',body:'One tap: yes or no.'}
};
const OPEN_BEFORE=2,CLOSE_AFTER=3;
const KEY='teampulse.v2',SKEY='teampulse.session.v2';
let DB,SESSION=null,R={name:'signin',p:{}},Q='',MAILVIEW=null;

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('en-US');
const num=n=>Number(n).toLocaleString('en-US');
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hashCode=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%5;
const first=u=>u.name.split(' ')[0];

function blank(){return {seq:1,teams:[],users:[],tokens:[],mail:[],feed:[],claims:[],dismissed:[],testDate:null}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.users))return Object.assign(blank(),d)}}catch(_){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(_){}}
function setSession(id){SESSION=id;try{if(id)localStorage.setItem(SKEY,id);else localStorage.removeItem(SKEY)}catch(_){}}
function loadSession(){try{return localStorage.getItem(SKEY)}catch(_){return null}}
const nid=p=>p+(DB.seq++)+Math.random().toString(36).slice(2,6);

/* ============================== time ============================== */
const pad2=n=>String(n).padStart(2,'0');
const toISO=dt=>dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
const fromISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(dt,n)=>new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+n);
const dmy=dt=>dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtISO=iso=>iso?dmy(fromISO(String(iso).slice(0,10))):'—';
const monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en-GB',{month:'long'});
const monthShort=(y,m)=>new Date(y,m,1).toLocaleDateString('en-GB',{month:'short'});
const nowD=()=>DB.testDate?new Date(DB.testDate+'T12:00:00'):new Date();
const today=()=>{const n=nowD();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const P=()=>{const t=today();return {y:t.getFullYear(),mo:t.getMonth()}};
function ago(iso){const d=Math.round((today()-new Date(new Date(iso).getFullYear(),new Date(iso).getMonth(),new Date(iso).getDate()))/864e5);return d<=0?'today':d===1?'yesterday':d<8?d+' days ago':dmy(new Date(iso))}
function teamLine(T){
  const y=T.getFullYear(),m=T.getMonth(),d=T.getDate();
  if(d<15){const left=15-d;return `Your team's ${monthName(y,m)} ends in ${left} day${left>1?'s':''}. Team ${monthName(y,m+1)} starts on 15 ${monthShort(y,m)}.`}
  return `Team ${monthName(y,m+1)}, day ${d-14}. Team ${monthName(y,m+2)} starts on 15 ${monthShort(y,m+1)}.`;
}

/* ---------- answer windows: open 2 days before a question's date, close 3 days after ---------- */
function occ(key,y,m){const q=new Date(y,m,CI[key].d);return {key,date:q,id:key+'@'+toISO(q),open:addDays(q,-OPEN_BEFORE),close:addDays(q,CLOSE_AFTER)}}
const occId=(key,y,m)=>occ(key,y,m).id;
function ciState(key){
  const T=today(),list=[-1,0,1].map(o=>occ(key,T.getFullYear(),T.getMonth()+o));
  const open=list.find(o=>o.open<=T&&T<=o.close);
  if(open)return {state:'open',o:open};
  return {state:'locked',o:list.find(o=>o.open>T),last:[...list].reverse().find(o=>o.close<T)};
}
const monthOccs=()=>{const {y,mo}=P();return KEYS.map(k=>occ(k,y,mo))};
function prog(u){const T=today(),due=monthOccs().filter(o=>o.open<=T);return {due:due.length,done:due.filter(o=>u.answers[o.id]).length,missed:due.filter(o=>o.close<T&&!u.answers[o.id]).length}}

/* ============================== people ============================== */
const U=id=>DB.users.find(u=>u.id===id);
const me=()=>SESSION?U(SESSION):null;
const kids=id=>DB.users.filter(x=>x.sponsorId===id&&x.status!=='inactive');
function downline(id){const out=[];const walk=i=>kids(i).forEach(k=>{out.push(k);walk(k.id)});walk(id);return out}
const teamMembers=u=>DB.users.filter(x=>x.teamId===u.teamId&&x.role==='member');
const liveMembers=u=>teamMembers(u).filter(x=>x.status!=='inactive');
const canSeeTeam=u=>u.role==='admin'||u.rank>=2;
const scopeOf=u=>u.role==='admin'?liveMembers(u):downline(u.id);
const rankName=u=>u.role==='admin'?'Team leader':RANKS[u.rank].n;
function newTP(){let t;do{t='0'+String(nowD().getFullYear()).slice(-1)+'OW'+String(Math.floor(Math.random()*1000)).padStart(3,'0')}while(DB.users.some(u=>u.tp===t));return t}
const validNeo=v=>/^\d{3}-\d{7}$/.test(v);
const normTP=s=>String(s||'').trim().toUpperCase().replace(/\s/g,'').replace(/0W/,'OW');
const strongPw=p=>p.length>=8&&/[A-Za-z]/.test(p)&&/\d/.test(p);
const PWRULE='At least 8 characters, with a letter and a number.';

/* month figures, read from what each person answered */
const ansM=(u,key)=>{const {y,mo}=P();return u.answers[occId(key,y,mo)]||null};
const ppvNow=u=>{const a=ansM(u,'ppv');if(a&&a.ppv!=null)return a.ppv;const j=new Date(u.joinedAt),{y,mo}=P();return(j.getFullYear()===y&&j.getMonth()===mo&&u.firstPv!=null)?u.firstPv:null};
const qpvRep=u=>{const a=ansM(u,'ppv');return a?a.qpv:null};
const earnNow=u=>{const a=ansM(u,'earn');return a?a.earn:null};
const paidNow=u=>{const a=ansM(u,'paid');return a?a.paid:null};
function calcQ(u){return (ppvNow(u)||0)+kids(u.id).filter(k=>k.rank!==4).reduce((s,k)=>s+calcQ(k),0)}
function recommend(u){
  const p=ppvNow(u),q=qpvRep(u);
  if(u.role!=='member'||u.status!=='active'||p==null||p<100||q==null)return null;
  let best=0;for(let i=1;i<=3;i++)if(q>=RANKS[i].q)best=i;
  return best>u.rank?best:null;
}
const qualified=u=>{const p=ppvNow(u),q=qpvRep(u);return u.rank>=1&&p!=null&&p>=100&&q!=null&&q>=RANKS[u.rank].q};
function series(users,n){
  const t=today(),out=[];
  for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1),y=d.getFullYear(),mo=d.getMonth();
    out.push({label:monthShort(y,mo),v:users.reduce((s,u)=>{const a=u.answers[occId('earn',y,mo)];return s+(a&&typeof a.earn==='number'?a.earn:0)},0)})}
  return out;
}
function dropsOf(users){
  const T=today(),out=[];
  users.forEach(u=>Object.entries(u.answers).forEach(([id,a])=>{if(id.startsWith('earn@')&&a.drop>0&&a.clears&&fromISO(a.clears)>=T)out.push({u,amount:a.drop,date:a.clears})}));
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* ============================== passwords, email and links ============================== */
async function hashPw(salt,pw){
  const s=salt+':'+pw;
  try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(_){}
  let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16)+(h1>>>0).toString(16);
}
const newSalt=()=>Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
async function setPassword(u,pw){u.salt=newSalt();u.pwHash=await hashPw(u.salt,pw);u.tries=0;u.locked=false}
function sendMail(to,subject,html,cta){DB.mail.unshift({id:nid('m'),to:to.email,toName:to.name,subject,html,cta:cta||null,at:nowD().toISOString(),read:false});save();updateTT()}
function makeToken(type,data){const t={id:nid('t'),type,data:data||{},exp:addDays(today(),7).toISOString(),used:false};DB.tokens.push(t);save();return t}
const tokenOk=t=>t&&!t.used&&new Date(t.exp)>=today();

function siteLink(){try{const h=(window.parent!==window?parent.location.href:location.href).split('#')[0].split('?')[0];if(/^https?:/.test(h))return h.replace(/app(\.html)?$/,'').replace(/\/$/,'')+'/'}catch(_){}return ''}
function shrinkPhoto(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}
function mailFrame(u,inner){return `<p>Hi ${esc(first(u))},</p>${inner}<p class="sub">TeamPulse · monthly check-ins for your team</p>`}
function inviteMail(m,token,leader){
  const sp=U(m.sponsorId)||leader,site=siteLink();
  sendMail(m,`Welcome to the family, ${first(m)}! Your TeamPulse ID is ${m.tp}`,
   `<p>Congratulations, ${esc(first(m))}, and welcome to the family! ${esc(sp.name)} is proud of you for stepping up and joining the business. Your first order of ${m.firstPv||0} PV makes you a NeoLife Distributor today.</p>
    <p style="margin:14px 0 4px">Your TeamPulse ID</p>
    <p style="font-size:1.4rem;font-weight:700;letter-spacing:.05em;margin:0 0 4px" class="mono">${esc(m.tp)}</p>
    ${site?`<p style="margin:0 0 4px">Your team website: <b>${esc(site)}</b></p>`:'<p style="margin:0 0 4px">Open your team website to sign in.</p>'}
    <p><b>Get your account ready in three steps:</b></p>
    <ol><li><b>Create your password.</b> Use the button below. You sign in with your TeamPulse ID and this password.</li><li><b>Upload your picture.</b> Your team sees it next to your name.</li><li><b>Complete your profile.</b> Add your phone number and your city.</li></ol>
    <p>The button works for 7 days. After that, open the website and sign in with your ID, or choose "Forgot your password?".</p>

function scheduleMail(){
  let changed=false;
  DB.users.filter(u=>u.role==='member'&&u.status==='active').forEach(u=>{
    u.sent=u.sent||{};
    KEYS.forEach(k=>{
      const st=ciState(k);
      if(st.state==='open'&&!u.answers[st.o.id]&&!u.sent[st.o.id]){
        u.sent[st.o.id]=1;changed=true;

    });
  });

}

function dashboard(u){
  const mem=liveMembers(u),act=mem.filter(x=>x.status==='active');
  const P_=Object.fromEntries(mem.map(m=>[m.id,prog(m)]));
  const slots=mem.reduce((s,m)=>s+P_[m.id].due,0),done=mem.reduce((s,m)=>s+P_[m.id].done,0),pct=slots?Math.round(done/slots*100):0;
  const activeP=act.filter(m=>(ppvNow(m)||0)>=100).length;
  const unpaid=act.filter(m=>paidNow(m)===false).length;
  const invited=mem.filter(m=>m.status==='invited');
  const recs=act.map(m=>[m,recommend(m)]).filter(([m,r])=>r!=null&&!DB.dismissed.includes(m.id));
  const late=act.filter(m=>P_[m.id].done<P_[m.id].due);
  const claims=DB.claims.filter(c=>c.teamId===u.teamId&&['review','ready'].includes(c.state));
  const f=R.p.filter||'all',q=Q.trim().toLowerCase();

/* ============================== network tree ============================== */
function orgTree(u,list,roots){
  const col=R.p.col||[],kidsOf=m=>kids(m.id).filter(k=>list.some(x=>x.id===k.id));
  const depthCount=[];(function walk(ms,d){if(!ms.length)return;depthCount[d]=(depthCount[d]||0)+ms.length;ms.forEach(m=>walk(kidsOf(m),d+1))})(roots,0);
  const card=(m,isRoot)=>{
    const c=isRoot?[]:kidsOf(m),n=isRoot?roots.length:c.length;
    const tog=n?`<button class="otog" type="button" data-act="tog" data-id="${m.id}" aria-expanded="${!col.includes(m.id)}" aria-label="${col.includes(m.id)?'Show':'Hide'} ${n} below ${esc(m.name)}">${col.includes(m.id)?'+':'&minus;'} ${n}</button>`:'';
    const ppv=ppvNow(m),q=qpvRep(m);
    const stats=m.status==='invited'?'<span class="ost">Invited. No login yet.</span>':m.status==='inactive'?'<span class="ost">Inactive</span>':isRoot?`<span class="ost">${roots.length} directly sponsored</span>`:`<span class="ost">${ppv==null?'No PPV yet':num(ppv)+' PPV'}</span>${n&&q!=null?`<span class="ost sm">${num(q)} QPV</span>`:''}`;
    return `<div class="ocard ${isRoot?'root':''} ${m.status==='invited'?'inv':''} ${m.status==='inactive'?'dim':''}" ${isRoot?'':`data-act="member" data-id="${m.id}" role="button" tabindex="0"`}>${av(m,'lg')}<b class="on">${esc(isRoot?'You':m.name)}</b><span class="orank">${esc(rankName(m))}</span>${stats}<span class="mono oid">${esc(m.tp)}</span></div>${tog}`;
  };
  const li=m=>{const c=kidsOf(m);return `<li>${card(m,false)}${c.length&&!col.includes(m.id)?`<ul>${c.map(li).join('')}</ul>`:''}</li>`};
  const rootLi=`<li>${card(u,true)}${roots.length&&!col.includes(u.id)?`<ul>${roots.map(li).join('')}</ul>`:''}</li>`;
  const lv=depthCount.map((n,i)=>`<span class="pill">Level ${i+1}: ${n}</span>`).join('');
  return `<div class="otree-wrap"><div class="inline" style="margin:12px 0 4px;gap:8px"><span class="sub">Your network, level by level.</span>${lv}</div>
    <p class="sub" style="margin:0 0 8px">Select a person for their profile. Use the numbered button under a person to hide or show the people below them. Scroll sideways when the tree is wide.</p>
    <div class="otree" tabindex="0" aria-label="Network tree"><ul>${rootLi}</ul></div></div>`;
}

function team(u){

  const admin=u.role==='admin';
  const shown=list.filter(m=>!q||(m.name+' '+m.tp+' '+m.neoId).toLowerCase().includes(q));
  const node=(m)=>{const c=kids(m.id).filter(k=>list.some(x=>x.id===k.id));
    return `<div class="node ${m.status==='inactive'?'dim':''}" data-act="member" data-id="${m.id}">${av(m)}<div style="flex:1 1 180px"><div style="font-weight:600">${esc(m.name)} ${statusPill(m)}</div><div class="mono sub">${esc(m.tp)} · ${esc(m.neoId)}</div></div>${pill(rankName(m),m.rank>=1?'acc':'')}</div>${c.length?`<div class="lvl">${c.map(node).join('')}</div>`:''}`};

  return `<div class="head"><div><h2>${admin?'Team':'My team'}</h2><p class="sub" style="margin:2px 0 0">${list.length} member${list.length===1?'':'s'}${admin?'':' in your downline. You see their results, and nobody outside it.'}</p></div>

    <section class="card">${body}</section>`;
}

function checkins(u){
  const key=KEYS.includes(R.p.key)?R.p.key:(KEYS.map(k=>[k,ciState(k)]).find(([k,s])=>s.state==='open'&&!u.answers[s.o.id])||[KEYS[0]])[0];

   :`<div class="mail"><div class="meta">${c.title} · open ${dmy(st.o.open)} to ${dmy(st.o.close)}</div><div class="subj">${c.subject}</div><p>Hi ${esc(first(u))}, ${c.body}</p><p class="meta">It takes about two minutes. Your answer counts for the ${c.day}, even if you send it a few days late (until ${dmy(st.o.close)}).</p></div>${ciForm(key,u,st.o)}`;
  return `<div class="head"><div><h2>Check-ins</h2><p class="sub" style="margin:2px 0 0">Each question opens 2 days before its date and closes 3 days after.</p></div></div>

const goalRow=(p,t)=>`<div class="goal"><select name="gp" aria-label="Goal starts with"><option ${p==='I will'?'selected':''}>I will</option><option ${p==='I must'?'selected':''}>I must</option></select><input name="gt" type="text" aria-label="Goal" value="${esc(t)}" placeholder="what you will do"></div>`;

const VIEWS={dashboard,team,addmember,memberadded,signups,claimdetails,feed,profile,home,checkins};
const ADMIN_ONLY=['dashboard','addmember','memberadded'];
const MEMBER_ONLY=['home','checkins','claimdetails'];

/* ============================== rendering ============================== */
function go(name,p){MENU=null;R={name,p:p||{}};render();window.scrollTo(0,0)}
function render(){
  const u=me();
  let name=R.name;
  if(!AUTH_ROUTES.includes(name)){
    if(!u){R={name:'signin',p:{next:{name:R.name,p:R.p}}};name='signin'}
    else if((u.role!=='admin'&&ADMIN_ONLY.includes(name))||(u.role==='admin'&&MEMBER_ONLY.includes(name))||(name==='team'&&!canSeeTeam(u)))go(homeRoute(u));
  }
  if(R.name!==name||!AUTH_ROUTES.includes(R.name)||true){}
  const cur=R.name;
  $('#root').innerHTML=AUTH_ROUTES.includes(cur)?AUTH[cur]():shell(me());
  afterRender();
  renderModal();updateTT();
}
function afterRender(){
  document.querySelectorAll('.auth-card input[type=password]').forEach(i=>{
    const w=document.createElement('span');w.className='pwwrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
    const b=document.createElement('button');b.type='button';b.className='pwtog';b.textContent='Show';b.setAttribute('aria-label','Show password');
    b.onclick=()=>{const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show';b.setAttribute('aria-label',s?'Hide password':'Show password')};
    w.appendChild(b);
  });
  const q=$('#q');if(q)q.oninput=e=>{Q=e.target.value;const pos=e.target.selectionStart;render();const nq=$('#q');if(nq){nq.focus();nq.setSelectionRange(pos,pos)}};
  const en=$('#e-none');if(en)en.onchange=e=>{$('#e-amt').disabled=e.target.checked};
  const pp=$('#p-ppv'),pq=$('#p-qpv'),pn=$('#p-none');
  if(pp){
    const upd=()=>{
      const v=pp.value===''?null:Number(pp.value),h=$('#p-ppvh');
      if(v==null){h.className='hint';h.textContent='NeoLife asks for 100 PPV to stay active.'}
      else if(v<100){h.className='hint bad';h.textContent=v+' PPV is under the 100 minimum. You will not be active for bonuses this month.'}
      else{h.className='hint good';h.textContent=v+' PPV. You meet the 100 minimum.'}
      const qv=pn.checked?(v||0):(pq.value===''?null:Number(pq.value)),qh=$('#p-qpvh');
      if(qv==null){qh.className='hint';qh.textContent='If you have no downline, your QPV is just your PPV.'}
      else{let best=0;for(let i=1;i<=3;i++)if(qv>=RANKS[i].q)best=i;

    if(!none&&g('amt')==='')return fail('e-err','Enter an amount, or tick "Not yet".');
    if(drop>0&&!g('clears'))return fail('e-err','Add the date the money drops, so your leader can plan your PPV order.');
    put({earn:none?'none':Number(g('amt')),orders:g('orders')===''?0:Number(g('orders')),delivered:g('delivered')===''?0:Number(g('delivered')),drop,clears:g('clears')||null});
    render();toast('Saved');return;
  }
  if(k==='ppv'){
    if(g('ppv')==='')return fail('p-err','Enter your PPV.');
    const ppv=Number(g('ppv')),qpv=d.get('none')==='on'?ppv:(g('qpv')===''?ppv:Number(g('qpv')));
    put({ppv,qpv});render();toast(ppv<100?'Saved. Under 100 PPV, so your leader will see a flag.':'Saved. You meet the 100 PPV minimum.');return;
  }
  if(k==='plan'){
    const p=d.getAll('gp'),t=d.getAll('gt'),goals=p.map((x,i)=>[x,String(t[i]).trim()]).filter(x=>x[1]);
    if(!goals.length)return fail('pl-err','Write at least one goal after "I will" or "I must".');
    put({goals,signups:Number(g('signups')||0),target:g('target'),pp:g('pp'),pq:g('pq')});render();toast('Plan saved');return;
  }
  if(k==='paid'){
    const v=g('paid');if(!v)return fail('paid-err','Choose yes or not yet.');
    put({paid:v==='yes'});render();toast('Saved');return;
  }
  if(k==='signup'){
    const v=g('su');if(!v)return fail('su-err','Choose yes or no.');
    const n=Math.max(1,Number(g('count')||1));
    put({su:v,count:n,steps:[0,1,2,3].map(i=>Number(g('st'+i)||0)),tools:g('tools')});
    if(v==='yes'&&!DB.claims.some(c=>c.by===u.id&&c.occ===st.o.id)){DB.claims.unshift({id:nid('c'),teamId:u.teamId,by:u.id,count:n,who:'',state:'review',at:nowD().toISOString(),occ:st.o.id});save()}
    render();toast(v==='yes'?'Saved. Your team leader will review your '+n+' sign-up'+(n>1?'s':'')+'.':'Saved');return;
  }
});

/* ============================== start ============================== */
function openSigninFromLanding(){
  let id='';try{id=sessionStorage.getItem('tp_id')||'';sessionStorage.removeItem('tp_id')}catch(_){}
  if(me()){go(homeRoute(me()));return}
  go('signin',{prefill:id});
  const el=$(id?'#si-pw':'#si-id');if(el)el.focus();
}
function openRegisterFromLanding(){if(me())setSession(null);go('register');const el=$('#rg-name');if(el)el.focus()}
function openAppFromLanding(){const u=me();if(u)go(homeRoute(u));else go('signin')}
const embedded=window.parent!==window;
const embeddedHash=()=>{try{return embedded?parent.location.hash:''}catch(_){return ''}};

DB=load();SESSION=loadSession();
if(SESSION&&!U(SESSION))setSession(null);
scheduleMail();
(function start(){
  const h=embedded?embeddedHash():location.hash;
  if(h==='#signin'||h==='#app-signin')openSigninFromLanding();
  else if(h==='#register'||h==='#app-register')openRegisterFromLanding();
  else openAppFromLanding();
})();
window.TP={db:()=>DB,route:()=>R,go,me,mail:()=>DB.mail,openCta,openToken};
</script>
